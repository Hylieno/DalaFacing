name: Sync main with release

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-main-with-release
  cancel-in-progress: false

jobs:
  sync-main:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0

      - name: Fast-forward main to release
        shell: bash
        run: |
          git fetch origin main release
          if ! git merge-base --is-ancestor origin/main origin/release; then
            echo "main has commits that are not in release; refusing to overwrite it."
            exit 1
          fi
          git push origin origin/release:refs/heads/main
